<!--

Data la tabella, creare un foglio di stile tale che:

1. La tabella abbia un bordo di 1px di colore #263238 e sia larga la metà della pagina.
2. Il titolo della tabella deve essere di colore #263238,in grassetto e grandezza 18px. 
   Aggiungere inoltre un margine per staccare il testo dalla tabella
3. L'header della tabella abbia colore di sfondo #455a64 e testo bianco con peso 700.
4. Le righe della tabella abbiano colore di sfondo alternato tra #eceff1 e #b0bec5.
5. L'ultima riga della tabella abbia testo con peso 800 e sfondo di colore #78909c.
6. Nel corpo della tabella la colonna delle entrate ha un testo di colore #003300.
7. Nel corpo della tabella la colonna delle uscite ha un testo di colore #7f0000.
8. I valori numerici sono allineati a destra.

-->

<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lezione CSS</title>
    <style>
        
        table {
            border: 1px solid #263238;
            width: 50vw;
        }

        caption {
            color: #263238;
            font-weight: bold;
            font-size: 18px;
            margin: 10px;
        }

        tr th {
            background-color: #455a64;
            color: white;
            font-weight: 700;
        }

        tbody tr:nth-child(even) {
            background-color: #eceff1;
        }

        tbody tr:nth-child(odd) {
            background-color: #b0bec5;
        }

        tfoot tr td {
            font-weight: 800;
            background-color: #78909c;
        }
        
        tbody tr td:nth-child(2) {
            color: #003300;
            text-align: right;
        }

        tbody tr td:nth-child(3) {
            color: #7f0000;
            text-align: right;
        }

        tfoot tr td:nth-child(n + 2) {
            text-align: right;
        }

    </style>
</head>

<body>
    <table>
        <caption>Entrate e uscite</caption>
        <thead>
            <tr>
                <th>Mese</th>
                <th>Entrate</th>
                <th>Uscite</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Gennaio</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Febbraio</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Marzo</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Aprile</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Maggio</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Giugno</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Luglio</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Agosto</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Settembre</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Ottobre</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Novembre</td>
                <td>10</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Dicembre</td>
                <td>10</td>
                <td>9</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <td>Totale</td>
                <td>120</td>
                <td>108</td>
            </tr>
        </tfoot>
    </table>

</body>
