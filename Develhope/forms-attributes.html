<!-- Esercizio sugli attributi

 Aggiungi alla pagina html:

- Un pulsante disabilitato
- Un input field di tipo number con una label con un intervallo da 0 a 100 e con step di 2. 
L'input field dovrà avere l'autofocus all'apertura della pagina
- Una checkbox con relativa label (la checkbox dovrà già essere selezionata)
- Un input field di tipo date.
-->


<!DOCTYPE html>
<html>
    <head lang="it">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Lezione HTML</title>
    </head>
<body>
    <main>
        <div>
            <label for="socks">Numero di calzini</label>
            <input id="socks" name="socks" type="number" min="0" max="100" autofocus step="2"> 
        </div>
        <fieldset>
            <legend>Includi spedizione</legend>
            <div>
                <input type="checkbox" id="shipping" name="user_shipping" checked />
                <label for="shipping">Accetti i termini e le condizioni</label>
            </div>
        </fieldset>
        <div>
            <label for="shipping_date">Seleziona il giorno di spedizione</label>
            <input id="shipping_date" type="date">
        </div>
        <div>
            <button type="button" name="user_data" disabled>Acquista!</button>
        </div>
    </main>
</body>
</html>
